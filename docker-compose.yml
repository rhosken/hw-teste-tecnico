version: "3.8"
networks:
  net_vpn:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.40.0/24
  net_dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  net_app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.20.0/24
  net_db:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.30.0/24

services:
  # --- VPN Gateway ---
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: vpn-gateway
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - SERVERURL=auto
      - SERVERPORT=51820
      - PEERS=1
      - PEERDNS=auto
      - INTERNAL_SUBNET=172.28.40.0/24
      - ALLOWEDIPS=172.28.10.0/24,172.28.20.0/24,172.28.30.0/24
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks:
      net_vpn:
        ipv4_address: 172.28.40.2
    restart: unless-stopped

  # --- Bastion (única forma de SSH/painel administrativo) ---
  bastion:
    build: ./bastion
    container_name: bastion
    networks:
      net_vpn:
        ipv4_address: 172.28.40.10
      net_dmz:
        ipv4_address: 172.28.10.10
      net_app:
        ipv4_address: 172.28.20.10
      net_db:
        ipv4_address: 172.28.30.10
    restart: unless-stopped

  # --- WAF / Reverse Proxy (DMZ) ---
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    environment:
      - PROXY=1
      - BACKEND=http://dvwa:80
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - BLOCKING_PARANOIA=1
    ports:
      - "8443:8080"   # único ponto de entrada externo para a aplicação
    networks:
      net_dmz:
        ipv4_address: 172.28.10.20
      net_app:
        ipv4_address: 172.28.20.20
    depends_on:
      - dvwa
    restart: unless-stopped

  # --- App vulnerável (APP) ---
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: dvwa
    environment:
      - DB_SERVER=db
      - DB_DATABASE=dvwa
      - DB_USER=dvwa
      - DB_PASSWORD=p@ssw0rd
    networks:
      net_app:
        ipv4_address: 172.28.20.30
      net_db:
        ipv4_address: 172.28.30.30
    depends_on:
      - db
    restart: unless-stopped
    # NÃO publicar porta aqui — só o WAF (na DMZ) deve alcançar a APP.

  # --- Banco de dados (DB, isolado) ---
  db:
    image: mariadb:10.11
    container_name: dvwa-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_p@ssw0rd
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    networks:
      net_db:
        ipv4_address: 172.28.30.40
    restart: unless-stopped
